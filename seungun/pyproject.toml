[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-phone-ctc"
version = "0.1.0"
description = "Auditable AI Hub Korean phone CTC baseline"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
inference = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "soundfile==0.14.0",
  "torch==2.12.1",
  "transformers==5.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["korean_phone_ctc"]
