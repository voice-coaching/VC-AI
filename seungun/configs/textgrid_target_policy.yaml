version: textgrid-observed-phone-v1
status: automated_preparation_complete_manual_audit_required
purpose: >-
  Conservative policy for converting AI Hub TextGrid phone tiers into
  observed-phone CTC targets. Automated preparation is complete, but this
  file does not authorize training before independent manual audit.

inventory:
  - spn
  - ㄱ
  - ㄲ
  - ㄴ
  - ㄷ
  - ㄸ
  - ㄹ
  - ㅁ
  - ㅂ
  - ㅃ
  - ㅅ
  - ㅆ
  - ㅇ
  - ㅈ
  - ㅉ
  - ㅊ
  - ㅋ
  - ㅌ
  - ㅍ
  - ㅎ
  - ㅏ
  - ㅐ
  - ㅑ
  - ㅒ
  - ㅓ
  - ㅔ
  - ㅕ
  - ㅖ
  - ㅗ
  - ㅘ
  - ㅙ
  - ㅚ
  - ㅛ
  - ㅜ
  - ㅝ
  - ㅞ
  - ㅟ
  - ㅠ
  - ㅡ
  - ㅢ
  - ㅣ

rules:
  empty_interval: drop
  exact_ascii_hyphen: drop_as_expected_phone_deletion_placeholder
  whitespace_separated_known_phones: split
  concatenated_known_single_codepoint_phones: split
  exact_known_phone: preserve
  unresolved_label: reject_entire_utterance

aliases: {}
forbidden_implicit_actions:
  - Hangul syllable to phone conversion
  - punctuation stripping
  - SPN case folding
  - g2p substitution
  - confidence generation

exclusions:
  unresolved_label: reject_entire_utterance
  missing_phone_tier: reject_entire_utterance
  empty_target_after_normalization: reject_entire_utterance
  source_qc_flag: reject_entire_utterance
  duplicate_pcm: keep_first_only
  audio_longer_than_20_seconds: reject_entire_utterance

manual_alignment_gate:
  required_samples: 240
  minimum_accuracy: 0.95
  status: pending

training_allowed: false
