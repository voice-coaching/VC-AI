    - alignment_operation
    - error_tag
    - error_count
    - phone_interval
    - word_interval
    - oracle_alignment
    - predicted_alignment
    - s1_prediction
    - s1_score
    - s1_logit
    - s1_probability
    - s1_confidence
    - s1_threshold
    - s1_label
    - s1_wavlm_embedding
    - s1_explicit_feature
  s1_predictions_allowed: false
  s1_labels_allowed: false
  s1_features_allowed: false
  s1_thresholds_allowed: false
  oracle_alignment_allowed: false
  predicted_alignment_allowed: false
  whisper_timestamps_as_features_allowed: false
