model:
  identity:
    provider: huggingface_hub
    model_id: openai/whisper-large-v3
    revision: 06f233fe06e710322aca913c1bc4249a0d71fce1
    official_source_revision: 90fdc51112dc59242201d038a48add97ffd24b5d
    architecture: WhisperForConditionalGeneration
    weight_format: safetensors_only
    pickle_weights_allowed: false
    license: MIT
    license_sha256: b5d65a59060e68c4ff940e1eddfa6f94b2d68fdf58ed7f4dd57721c997e35e9d
    license_reaudit_before_acquisition: true
  preprocessor:
    processor_id: openai/whisper-large-v3
    revision: 06f233fe06e710322aca913c1bc4249a0d71fce1
    processor_class: WhisperProcessor
    feature_extractor_class: WhisperFeatureExtractor
    tokenizer_class: WhisperTokenizerFast
    sampling_rate_hz: 16000
    feature_size: 128
    hop_length: 160
    n_fft: 400
    chunk_length_seconds: 30
    configuration_source: same_exact_local_revision
  offline_only:
    local_files_only: true
    hf_hub_offline_required: true
    transformers_offline_required: true
    network_fallback_allowed: false
    automatic_download_allowed: false
    execution_when_local_bundle_missing_allowed: false
    bundle_root: models/whisper/openai_whisper_large_v3/06f233fe06e710322aca913c1bc4249a0d71fce1
    attestation_path: artifacts/model_attestations/s2_s201_whisper_large_v3_06f233fe_v1.json
    attestation_status: missing_local_bundle
    attestation_sha256: TBD_LOCAL_BUNDLE

transcript_normalization:
  policy_id: ko_s201_nfc_literal_v1
  ordered_steps:
    - decode_utf8_strict
    - unicode_nfc
    - unicode_casefold
    - replace_unicode_punctuation_with_space
    - map_all_unicode_whitespace_to_ascii_space
    - collapse_ascii_spaces
    - strip_ascii_space
  apply_identically_to_reference_and_hypothesis: true
  unicode_normalization: NFC
  latin_case_policy: unicode_casefold
  punctuation_policy: all_unicode_general_category_P_to_space
  digit_expansion: none
  morphological_tokenizer: none
  pronunciation_rewrite: none
  spell_correction: none
  word_unit: ascii_space_delimited_token
  character_unit: unicode_codepoint_excluding_space
  empty_reference_policy: invalid_item_fail_closed
  raw_transcript_export_allowed: false

language_and_decoding:
  language: ko
  language_token: <|ko|>
  task: transcribe
  language_detection_allowed: false
  translation_allowed: false
  forced_language_required: true
  do_sample: false
  temperature: 0.0
  num_beams: 1
  num_return_sequences: 1
  return_timestamps: false
  timestamp_features_allowed: false
  condition_on_prev_tokens: false
  fallback_temperatures: [0.0]
  max_new_tokens: 448
  generation_config_source: exact_local_bundle_revision

determinism:
  seed: 20260729
  torch_deterministic_algorithms: true
  cudnn_benchmark: false
  cudnn_deterministic: true
  allow_tf32: false
  cublas_workspace_config: ":4096:8"
  transformers_version: 5.14.1
  torch_version: 2.12.1+cu130
  tokenizers_version: 0.22.2
  safetensors_version: 0.8.0

hard_gate:
  role: content_consistency_only
  evaluated_before_s202: true
  bypass_allowed: false
  failed_content_rescue_by_s202_allowed: false
  fine_phone_judgment_allowed: false
  prosody_judgment_allowed: false
  metrics:
    wer:
      formula: word_levenshtein_distance_over_reference_word_count
      operator: less_than_or_equal
      threshold: TBD_PREREGISTRATION
    cer:
      formula: codepoint_levenshtein_distance_over_reference_character_count
      operator: less_than_or_equal
      threshold: TBD_PREREGISTRATION
    content_mismatch:
      formula: TBD_PREREGISTRATION
      operator: TBD_PREREGISTRATION
      threshold: TBD_PREREGISTRATION
  threshold_preregistration:
    status: TBD_PREREGISTRATION
    path: artifacts/preregistration/s2_s201_whisper_content_thresholds_v1.json
    sha256: TBD_PREREGISTRATION
    execution_allowed: false
    must_be_frozen_before_data_or_model_path_resolution: true
    native_external_benchmark_may_set_threshold: false

data_roles:
