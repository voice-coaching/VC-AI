experiment:
  id: gtx1660_mvp_v1
  description: Frozen WavLM and explicit-feature MVP for Korean L2 coaching
  seeds: [42, 43, 44]
  primary_metric: phone_macro_f1

hardware:
  device: cuda:0
  gpu_name: NVIDIA GeForce GTX 1660
  total_vram_mib: 6144
  min_free_vram_before_start_mib: 4400
  target_peak_allocated_mib: 3500
  hard_stop_peak_allocated_mib: 4000
  min_system_free_vram_during_run_mib: 600
  feature_batch_size: 1
  dataloader_workers: 2
  torch_compile: false
  allow_tf32: false
  benchmark_fp16: true
  default_precision: fp32

data:
  dataset_id: aihub_71490
  manifest: artifacts/manifests/aihub71490_mvp.parquet
  sample_rate_ssl: 16000
  sample_rate_prosody: 48000
  max_chunk_seconds: 8.0
  chunk_overlap_seconds: 1.0
  join_key: file_stem
  interval_join:
    method: max_temporal_overlap
    tolerance_ms: 30
    min_overlap_ratio: 0.50
  split:
    group_key: speaker_id
    train_ratio: 0.50
    dev_ratio: 0.10
    stack_ratio: 0.10
    calibration_ratio: 0.10
    locked_test_ratio: 0.20
    prompt_challenge: true
    forbid_speaker_overlap: true
  subsets:
    smoke:
      train: 256
      dev: 128
      test: 128
    model_smoke:
      total: 2000
    pilot:
      train: 10000
      dev: 2000
      stack: 2000
      calibration: 2000
      locked_test: 4000
      max_utterances_per_speaker: 20
      rare_error_extra_per_speaker: 10
      min_total_speakers: 700
    scale:
      train: 100000
      dev: 5000
      stack: 5000
      calibration: 5000
      reuse_pilot_locked_test: true

qc:
  min_pairing_rate: 0.99
  max_decoder_failure_rate: 0.001
  max_time_bound_error_rate: 0.01
  manual_pairing_audit_size: 200
  min_manual_pairing_accuracy: 0.95

features:
  explicit:
    duration: true
    pause: true
    speech_rate: true
    f0: true
    energy: true
    npvi: true
    alignment_confidence: true
  ssl:
    model_id: microsoft/wavlm-base-plus
    frozen: true
    eval_mode: true
    no_grad: true
    output_hidden_states: false
    model_smoke_layer_candidates: [6, 9, 12]
    model_smoke_output_hidden_states: true
    pooling: [phone_mean, word_mean, utterance_mean_std]
    cache_dtype: float16
    cache_dir: artifacts/features/wavlm_base_plus
    cache_shard_size: 2000
    store_frame_embeddings: false
    cache_key_fields:
      - audio_checksum
      - model_revision
      - preprocessing_hash
      - selected_layer
      - dtype
    pca_ablation:
      enabled: true
      output_dim: 256
      fit_on: train
      max_allowed_phone_f1_drop: 0.01

models:
  explicit_baseline:
    phone_classifier: logistic_regression
    utterance_regressor: ordinal_logistic
    class_weight: balanced
  simple_ssl_head:
    input_dim: 768
    hidden_dim: 256
    dropout: 0.20
  hipama_lite:
    projection_dim: 256
    encoder_candidates: [bigru, transformer]
    bigru_hidden_dim: 128
    bigru_layers: 1
    transformer_layers: 2
    transformer_heads: 4
    max_trainable_parameters: 1500000
  fusion:
    type: confidence_gated_mlp
    hidden_dim: 32
    fit_split: stack
  calibration:
    phone_method: platt_scaling
    utterance_method: ordinal_temperature_scaling
    conformal_interval: 0.90
    fit_split: calibration
    target_ece: 0.10

trainer:
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  max_phones: 128
  cached_batch_size: 16
  max_cached_batch_size_after_benchmark: 32
  gradient_accumulation_steps: 2
  max_epochs: 30
  early_stopping_patience: 5
  gradient_clip_norm: 1.0

hardware_benchmark:
  sample_count: 1000
  stress_lengths_seconds: [2, 4, 8, 12]
  warmup_runs: 2
  measured_runs: 10
  max_oom_count: 0
  max_failure_rate: 0.01
  max_projected_pilot_hours: 48
  max_projected_cache_gib: 20
  max_wavlm_p95_rtf: 1.0

metrics:
  phone: [macro_f1, auprc, event_f1]
  utterance: [qwk, spearman, mae]
  calibration: [ece, brier, risk_coverage]
  slices: [l1, gender, proficiency, duration_bucket, error_type]

statistics:
  bootstrap_unit: speaker_id
  bootstrap_repetitions: 5000
  confidence_level: 0.95
  multiple_comparison_correction: holm
  locked_test_evaluations: 1

gates:
  explicit_phone_macro_f1: 0.50
  engineering_phone_macro_f1: 0.60
  coaching_phone_macro_f1: 0.75
  final_utterance_qwk: 0.55
  max_ece: 0.10
  min_issued_correction_precision: 0.90
  min_coaching_coverage: 0.70
  min_metamorphic_pass_rate: 0.95
  max_coaching_unsupported_claim_rate: 0.02
  min_ssl_improvement: 0.03
  min_hierarchy_improvement: 0.02
  max_worst_group_gap: 0.10

tts:
  enabled_during_training: false
  execution: separate_sequential_process
  pregenerate_only: true
  exercise_sentences: 20
  candidates_per_sentence: 4
  selected_references_per_sentence: 3
  provide_reference_text: true
  benchmark:
    sentence_length_syllables: [20, 30]
    runs: 10
    max_process_peak_vram_mib: 4000
    min_system_free_vram_mib: 600
    max_p95_rtf: 3.0

logging:
  artifact_root: artifacts/experiments
  record_git_commit: true
  record_split_hash: true
  record_data_hash: true
  record_peak_vram: true
  record_wall_time: true
