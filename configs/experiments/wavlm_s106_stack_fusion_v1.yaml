    solver: lbfgs
    l1_ratio: 0.0
    maximum_iterations: 2000
    tolerance: 0.00000001
    class_weight: null
    standardization_fit_scope: fold_training_rows_only
    regularization_c_grid: [0.01, 0.1, 1.0, 10.0]
    threshold_grid:
      start: 0.10
      stop: 0.90
      step: 0.05
    primary_metric: speaker_macro_phone_macro_f1
    selection_scope: aggregate_oof_predictions_only
    selection_passes: 1
    tie_break:
      - higher_primary_metric
      - smaller_regularization_c
      - threshold_closest_to_0_5
      - lower_threshold
  controls:
    - explicit_only
    - s104_adapter_only
    - s105_selected_hierarchy_only
    - gop_only
    - unweighted_component_probability_mean
  control_and_disagreement_threshold: 0.5
  final_fit:
    source: full_stack_after_oof_selection
    selected_architecture_and_hyperparameters_frozen: true
    refit_count: 1
    in_sample_metrics_computed: false
    in_sample_metrics_reported: false
    evidence_role: checkpoint_only

