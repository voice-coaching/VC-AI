blindness_and_cherry_pick_controls:
  selector_input_allowlist:
    - candidate_id
    - sentence_id
    - target_text_sha256
    - r02_eligible_row_sha256
    - objective_vector
    - speed_bucket
    - pitch_bucket
    - blinded_speaker_cluster_id_sha256
  selector_input_denylist:
    - source_kind
    - source_attestation_sha256
    - human_or_tts
    - model_name
    - r04_label
    - r04_score
    - mos
    - cmos
    - learner_outcome
    - learning_gain
    - retention
    - publication_preference
  source_kind_join_only_after_selection: true
  per_sentence_sources_required_after_join:
    - human_recording
    - cosyvoice_tts
  maximum_per_sentence_source_count_difference: 1
  outcome_driven_reselection_allowed: false
  r04_feedback_driven_reselection_allowed: false
  posthoc_objective_or_threshold_change_allowed: false

lineage_contract:
  immutable_fields:
    - candidate_id
    - sentence_id
    - target_text_sha256
    - audio_object_id_sha256
    - audio_sha256
    - source_kind
    - source_attestation_sha256
    - speaker_id_sha256
    - speed_bucket
    - pitch_bucket
    - r02_eligible_row_sha256
  exact_join_to_r02_lineage_required: true
  audio_content_read_for_lineage_check_allowed: false
  quarantine_rows_allowed: false
  duplicate_candidate_allowed: false

