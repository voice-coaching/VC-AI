  prompt_challenge_reservation_sha256: 3ea7f12ea76be07a0796d7e62f0c3727ca9858c0278df7c85ac1e08d9b653fa9
  explicit_utterance_labels: data/processed/aihub71490/features/explicit_utterance_train_dev_v1.parquet
