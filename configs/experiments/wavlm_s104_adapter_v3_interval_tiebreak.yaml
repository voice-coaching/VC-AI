# S104 v3 — interval tie-break change (DEV-S104-005)
#
# v2 stays exactly as committed. Its source pin records the code that actually
# produced its artifacts, and re-pinning it would make that record false. This is a
# new contract for the new code, not an edit of the old one.
#
# Changed source: src/voice_coach/data/intervals.py — alignment matches are now
# ordered by zero-tolerance overlap first, so which realized interval attaches to
# which target can differ from v2. Artifacts must be regenerated; nothing from v2
# carries over.
schema_version: 1

experiment:
  id: aihub71490_wavlm_s104_adapter_v3_interval_tiebreak
  stage: s104_adapter
  development_only: true
  oracle_alignment: true
  silver_label: true
  promotion_decision_allowed: false
  seeds: [42, 43, 44]

s103:
  commit_manifest: artifacts/experiments/aihub71490_wavlm_frozen_head_comparison_v1/commit.json
  commit_schema_version: voice_coach.wavlm_frozen_head_comparison_commit.v1
  report_schema_version: voice_coach.wavlm_frozen_head_comparison.v1
  receipt_schema_version: voice_coach.wavlm_frozen_head_comparison_receipt.v1
  metric: phone_macro_f1
  effect: large_minus_base
  gate_rule: point_estimate_gte_threshold
  threshold_absolute: 0.03
  passed_candidate: large
  failed_candidate: base_plus

candidates:
  base_plus:
    model_id: microsoft/wavlm-base-plus
    revision: 4c66d4806a428f2e922ccfa1a962776e232d487b
