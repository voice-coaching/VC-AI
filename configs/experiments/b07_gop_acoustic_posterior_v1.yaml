posterior:
  class_count: 38
  prototype_fit_rows: binary_error_label_equals_zero_only
  prototype_fit_scope: primary_train_only
  row_normalization: l2
  prototype_formula: l2_normalize_mean_of_l2_normalized_rows
  similarity: cosine
  prior: uniform
  logits: cosine_divided_by_temperature
  fold_count: 5
  fold_unit: speaker_id_sha256
  fold_namespace: voice-coach.aihub71490.b07-gop-speaker-fold.v1
  fold_assignment_rule: sha256(namespace_colon_seed_colon_speaker)_first_8_bytes_big_endian_mod_5
  seed_binding: each_evaluation_seed_binds_its_own_five_fold_assignment
  inner_validation_rule: each_fold_exactly_once_as_validation_other_four_as_training
  train_validation_speaker_overlap_maximum: 0
  nonempty_training_and_validation_required_per_fold: true
  every_train_row_exactly_one_oof_feature: true
  every_class_required_in_each_training_complement: true
  temperature_grid: [0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0]
  temperature_selection:
    split: primary_train_inner_speaker_validation
    validation_fold_ids: [0]
    training_fold_ids: [1, 2, 3, 4]
    evidence: fold_0_oof_match_rows_only
    rows: match_only
    metric: multiclass_negative_log_likelihood
    direction: minimize
    tie_break: smaller_temperature
    final_dev_temperature:
      validation_fold_ids: [0]
      prototype_training_fold_ids: [1, 2, 3, 4]
    detector_outer_validation_nested_temperature:
      for_outer_fold_ids: [1, 2, 3, 4]
      validation_fold_ids: [0]
      prototype_training_rule: all_folds_except_temperature_fold_0_and_outer_validation_fold
      outer_validation_embedding_label_or_speaker_access: forbidden
  exact_features:
    - target_log_posterior
    - gop_margin
    - posterior_entropy
    - target_is_top1
  final_refit:
    prototypes: all_primary_train_match_rows
    dev_projection: selected_temperature_and_full_train_prototypes

detector:
  estimator: balanced_l2_logistic_regression
  solver: lbfgs
  maximum_iterations: 2000
  tolerance: 0.00000001
  categorical_features:
    - target_label
    - previous_target_label
    - next_target_label
  explicit_numeric_features:
    - oracle_duration_seconds
    - segment_rms
    - segment_zero_crossing_rate
  gop_numeric_features:
    - target_log_posterior
    - gop_margin
    - posterior_entropy
    - target_is_top1
  preprocessing:
    numeric_imputation: median
    numeric_imputation_fit_scope: fold_training_rows_only
    numeric_standardization: population_mean_and_scale
    numeric_standardization_fit_scope: fold_training_rows_only
    zero_scale_replacement: 1.0
    categorical_missing_token: __MISSING__
    categorical_unknown_token: __UNKNOWN__
    categorical_vocabulary_fit_scope: fold_training_rows_only
    category_order: sorted_utf8
  regularization_c_grid: [0.01, 0.1, 1.0, 10.0]
  threshold_grid:
    start: 0.20
    stop: 0.80
    step: 0.05
    stop_inclusive: true
  selection:
    split: primary_train_inner_speaker_validation
    validation_fold_ids: [1, 2, 3, 4]
    upstream_temperature_selection_fold_ids: [0]
    upstream_temperature_selection_is_disjoint_from_detector_validation: true
    nested_acoustic_feature_rule:
      outer_validation_rows: prototype_fit_on_all_primary_match_train_except_outer_fold
      detector_training_row: prototype_fit_on_primary_match_train_except_outer_fold_and_that_rows_acoustic_fold
      detector_training_row_fold_equals_temperature_fold: prototype_fit_on_primary_match_train_except_outer_fold_and_temperature_fold
      temperature: outer_fold_specific_selected_on_fold_0_with_outer_fold_excluded
      every_prototype_class_nonempty_required: true
      outer_validation_speaker_embedding_target_and_binary_label_in_upstream_fit: forbidden
      outer_validation_speaker_in_preprocessing_or_detector_fit: forbidden
    per_outer_fold_candidate_fit:
      fold_1: [0, 2, 3, 4]
      fold_2: [0, 1, 3, 4]
      fold_3: [0, 1, 2, 4]
      fold_4: [0, 1, 2, 3]
    candidate_probability_aggregation: row_pooled_outer_oof_folds_1_through_4
    candidate_metric_scope: all_primary_train_rows_in_outer_validation_folds_1_through_4
    candidate_fits_per_c: 4
    class_weight: balanced
    class_weight_fit_scope: each_outer_fold_detector_training_labels_only
    threshold_application: pooled_outer_oof_probabilities
    fold_rule: same_seed_bound_five_folds_as_acoustic_cross_fit
    each_detector_validation_fold_exactly_once: true
    temperature_role_fold_excluded_from_detector_metric: true
    train_validation_speaker_overlap_maximum: 0
    metric: phone_macro_f1
    metric_zero_division: 0.0
    direction: maximize
    tie_break_order:
      - smaller_c
      - threshold_closest_to_0.5
      - smaller_threshold
  paired_control:
    id: within_run_explicit_feature_refit_control
    role: b03_feature_family_control_not_canonical_b03_checkpoint_or_metric
    canonical_b03_claim_allowed: false
    canonical_b03_predictions_read: false
    same_train_dev_universe: true
    same_seed_folds_and_selection_contract: true
    features: categorical_plus_explicit_numeric
  final_refit:
    feature_rows: all_primary_train_cross_fit_rows
    preprocessing_fit_scope: all_primary_train_cross_fit_rows
    estimator_fit_scope: all_primary_train_cross_fit_rows
    class_weight_fit_scope: all_primary_train_labels
  serialized_checkpoint_exact_fields:
    acoustic:
      - inventory
      - embedding_dimension
      - selected_temperature
      - full_primary_train_match_prototypes
      - fold_namespace
      - seed
      - input_column_contract
    error:
      - feature_order
      - categorical_feature_order
      - categorical_vocabularies
      - categorical_missing_token
      - categorical_unknown_token
      - numeric_feature_order
      - numeric_imputation_medians
      - numeric_standardization_means
      - numeric_standardization_scales
      - class_order
      - coefficients
      - intercept
      - selected_c
      - selected_threshold
      - solver
      - seed
      - explicit_refit_control

