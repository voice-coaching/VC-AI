  per_variant_aggregate_artifacts:
    - variant_report
  global_artifacts:
    - ablation_comparison_report
    - ablation_table
  atomic_publish: true
  content_addressed_generation: true
  commit_pointer_required_for_visibility: true
  failure_registry:
