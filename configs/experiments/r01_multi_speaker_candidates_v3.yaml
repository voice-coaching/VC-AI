learner_facing:
  synthetic_disclosure_required: true
  synthetic_disclosure_ko: 이 참조 음성은 AI가 합성한 것입니다.
  exemplar_without_rights_basis_playable: false

outputs:
  bank_manifest:
    path: artifacts/reference/r01/multi_speaker_v3/bank.json
    schema_version: voice_coach.reference_bank_store.v1
  audio_dir: artifacts/reference/r01/multi_speaker_v3/audio
  receipt:
    path: artifacts/reference/r01/multi_speaker_v3/generation_receipt.json
  selection_id_prefix: r01-multi-speaker-v3
  selection_rule: r01_multi_speaker_v3_speed_by_speaker_cells_rate_gated

execution_order:
  - validate_r00_card_and_sentence_count
  - validate_cosyvoice_attestation_status_and_digest
  - validate_measured_speech_rate_band_digest_and_evidence
  - validate_prompt_voice_rights_and_audio_presence
  - synthesise_each_sentence_speaker_and_speed_cell
  - reject_and_re_render_any_rendering_outside_the_band
  - write_content_addressed_audio_without_overwrite
  - write_bank_manifest_and_receipt

stop_conditions:
  - the r00 card status or its validation verdict differs from the contract
  - the CosyVoice attestation digest or status differs
  - the measured speech-rate band digest differs from the pin
  - the band's utterance count differs from the count declared here
  - a prompt voice has no rights basis or no readable audio
  - the prompt voice count differs from distinct_prompt_voices
  - a content-addressed output path already exists

publication:
  r02_hard_gate_passed: false
  publication_allowed: false
  note_ko: >-
    이 뱅크는 R02의 하드 게이트(독립 ASR 내용 일치)를 통과하지 않았다.
    속도 밴드는 "말한 시간이 사람 범위인가"만 본다. "무슨 말을 했는가"는 보지 않는다.
