experiment:
  id: gb10_high_performance_v1
  description: High-performance GPU experiment for Korean L2 voice coaching
  seeds: [42, 43, 44]
  primary_metric: phone_macro_f1

hardware:
  device: cuda:0
  expected_gpu_name: NVIDIA GB10
  compute_capability: "12.1"
  unified_memory: true
  memory_accounting: system_available
  min_system_available_memory_gib: 32
  min_free_disk_gib: 500
  feature_batch_size_candidates: [1, 2, 4, 8]
  dataloader_workers_candidates: [4, 8, 12]
  precision_candidates: [bf16, fp32]
  default_precision: bf16
  allow_tf32: true
  torch_compile_benchmark: true
  fail_on_repeated_oom: 2

environment:
  os: Ubuntu 24.04
  architecture: aarch64
  python: "3.12"
  cuda_runtime: "13.0"
  scorer_environment: .venv-scorer
  data_environment: .venv-data
  tts_environment: .venv-tts
  isolate_scorer_and_tts_processes: true

data:
  dataset_id: aihub_71490
  manifest: data/processed/aihub71490/manifests/aihub71490_enriched.parquet
  modeling_manifest: data/processed/aihub71490/manifests/aihub71490_modeling.parquet
  sample_rate_ssl: 16000
  sample_rate_prosody: 48000
  max_chunk_seconds_candidates: [8, 12, 20]
  chunk_overlap_seconds: 1.0
  join_key: file_stem
  interval_join:
    method: strongest_unused_temporal_overlap
    tolerance_ms: 30
    min_overlap_ratio: 0.50
    preserve_one_to_many: false
  split:
    group_key: speaker_id
    train_ratio: 0.50
    dev_ratio: 0.10
    stack_ratio: 0.10
    calibration_ratio: 0.10
    locked_test_ratio: 0.20
    prompt_challenge: true
    forbid_speaker_overlap: true

qc:
  min_pairing_rate: 0.99
  max_decoder_failure_rate: 0.001
  max_time_bound_error_rate: 0.01
  manual_pairing_audit_size: 240
  min_manual_pairing_accuracy: 0.95
  forbid_cross_split_pcm_duplicates: true

features:
  explicit:
    duration: true
    pause: true
    speech_rate: true
    f0: true
    energy: true
    npvi: true
    alignment_confidence: true
  ssl:
    base_model_id: microsoft/wavlm-base-plus
    large_model_id: microsoft/wavlm-large
    frozen_first: true
    pooling: [phone_mean, word_mean, utterance_mean_std]
    cache_dtype: float16
    cache_shard_size: 2000
    store_frame_embeddings: false

model_sequence:
  - explicit_baseline
  - wavlm_base_plus_frozen
  - wavlm_large_frozen
  - wavlm_base_plus_adapter
  - wavlm_large_adapter_or_partial
  - multitask_hierarchical_head
  - confidence_aware_fusion
  - calibrated_selective_scorer

training:
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  batch_size_candidates: [16, 32, 64, 128]
  gradient_accumulation_candidates: [1, 2, 4]
  max_epochs: 30
  early_stopping_patience: 5
  gradient_clip_norm: 1.0
  gradient_checkpointing_benchmark: true

hardware_benchmark:
  sample_count: 1000
  input_lengths_seconds: [8, 12, 20]
  warmup_runs: 2
  measured_runs: 10
  record_system_available_memory: true
  record_process_rss: true
  record_cuda_oom: true
  record_wall_time: true
  max_oom_count: 0
  max_failure_rate: 0.01

metrics:
  phone: [macro_f1, auprc, event_f1]
  utterance: [qwk, spearman, mae, icc]
  calibration: [ece, brier, risk_coverage]
  slices: [l1, gender, proficiency, duration_bucket, error_type]

statistics:
  bootstrap_unit: speaker_id
  bootstrap_repetitions: 5000
  confidence_level: 0.95
  multiple_comparison_correction: holm
  locked_test_evaluations: 1

gates:
  explicit_phone_macro_f1: 0.50
  engineering_phone_macro_f1: 0.60
  coaching_phone_macro_f1: 0.75
  final_phone_macro_f1: 0.80
  final_utterance_icc: 0.70
  max_ece: 0.10
  min_issued_correction_precision: 0.90
  min_metamorphic_pass_rate: 0.95
  max_coaching_unsupported_claim_rate: 0.02
  min_large_over_base_phone_f1: 0.03
  max_worst_group_gap: 0.10

tts:
  execution: separate_process
  exercise_sentences: 20
  candidates_per_sentence: 4
  selected_references_per_sentence: 3

logging:
  artifact_root: artifacts/experiments
  hardware_profile: artifacts/hardware/nvidia-gb10/profile.json
  record_git_commit: true
  record_split_hash: true
  record_data_hash: true
  record_memory: true
  record_wall_time: true
