evaluation_contract:
  sentence_ids:
    - R00-01
    - R00-02
    - R00-03
    - R00-04
    - R00-05
    - R00-06
    - R00-07
    - R00-08
    - R00-09
    - R00-10
    - R00-11
    - R00-12
    - R00-13
    - R00-14
    - R00-15
    - R00-16
    - R00-17
    - R00-18
    - R00-19
    - R00-20
  # A human condition is no longer required. The architecture under study is a
  # closed loop between a TTS generator and an evaluator, so a TTS-only condition
  # set is a complete design rather than a degraded one. Sources still declare
  # themselves and blinding still conceals which is which from the listener.
  candidate_sources_allowed:
    - cosyvoice_tts
    - human_recording
  candidate_sources_required_minimum_count: 1
  r02_hard_gate_failures_excluded_without_rescue: true
  mos:
    unit: listener_x_sentence_x_candidate
    scale_minimum: 1
    scale_maximum: 5
    integer_only: true
    dimensions:
      - naturalness
      - clarity
      - target_phone_accuracy
      - pedagogical_suitability
  cmos:
    unit: listener_x_sentence_x_same_sentence_pair
    scale_minimum: -3
    scale_maximum: 3
    integer_only: true
    pair_construction_policy: TBD_PREREGISTRATION
  blindness:
    conceal_system_names: true
    conceal_filenames_and_paths: true
    conceal_synthesis_status: true
    conceal_source_labels: true
    opaque_stimulus_ids_only: true
  randomization:
    scope: per_listener_within_sentence
    fatigue_blocks_required: true
    algorithm: TBD_PREREGISTRATION
    seed_commitment: TBD_PREREGISTRATION
    maximum_assignments_per_block: TBD_PREREGISTRATION
    maximum_consecutive_same_sentence_assignments: TBD_PREREGISTRATION
    break_policy: TBD_PREREGISTRATION

statistics_contract:
  target_power: 0.8
  two_sided_alpha: 0.05
  pilot_variance: TBD_EXTERNAL
  pilot_intra_listener_correlation: TBD_EXTERNAL
  listener_count_n: TBD_PREREGISTRATION
  primary:
    model_family: ordinal_mixed_effects
    listener_random_effect_required: true
    sentence_random_effect_required: true
    exact_estimand: TBD_PREREGISTRATION
    ordinal_link_function: TBD_PREREGISTRATION
    confidence_interval_definition: TBD_PREREGISTRATION
  secondary:
    bootstrap_only: true
    resampling_unit: TBD_PREREGISTRATION
    replicates: TBD_PREREGISTRATION
    seed_commitment: TBD_PREREGISTRATION
    confidence_interval_method: TBD_PREREGISTRATION
  multiplicity_strategy: TBD_PREREGISTRATION
  superiority_margin: TBD_PREREGISTRATION
  superiority_comparator: TBD_PREREGISTRATION
  rater_policy: TBD_PREREGISTRATION
  adjudication_policy: TBD_PREREGISTRATION

