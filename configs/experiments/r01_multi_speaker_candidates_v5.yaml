# v4 is not edited. It never produced a bank: its first six cells were rejected by a
# gate that was measuring the wrong quantity, and the run was stopped.
schema_version: 2

# v2 is NOT edited by this file. Its config, bank and receipt stay byte-identical,
# because a receipt says "this bank came from this code and this contract" and
# rewriting either turns a recorded run into a false claim. v2's bank is superseded
# and must not be served; see `superseded_predecessor` below.

experiment:
  id: r01_multi_speaker_candidates_v5
  stage: wp7_r01_reference_candidate_generation
  supersedes: r01_multi_speaker_candidates_v4
  claim_scope: engineering_provisional
  decision_record: DEV-R01-005
  decision_date_kst: 2026-08-09
  decision_by_role: project_owner
  amendment_reason: rate_gate_measured_whole_file_against_a_spoken_region_band
  amendment_reason_ko: >-
    v4의 게이트는 렌더링의 **파일 전체 길이**로 음절/초를 계산해, 코퍼스의
    `SpeechEnd - SpeechStart`(발화 구간)로 측정한 밴드와 비교했다. TTS 출력에는 앞뒤
    무음이 붙으므로 두 양은 비교 대상이 아니며, 정상 렌더링이 하한 바로 아래로 밀려
    기각됐다. 같은 기준(발화 구간)으로 다시 재자 후보 12명 중 사용 가능이 3명에서
    8명으로 바뀌었다.

    함께 확인된 사실 하나 더: **생성은 결정적이다.** 같은 셀을 두 번 렌더하면 바이트
    단위로 동일하다. 따라서 재시도는 아무것도 사지 못하며 max_attempts를 1로 낮춘다.
    밴드를 벗어난 셀을 고치는 방법은 다른 prompt 화자뿐이다.
  measured_conditions:
    - condition: rate_on_whole_file_v4_gate
      usable_of_twelve_candidates: 3
      note: 앞뒤 무음이 포함되어 정상 렌더링이 하한 아래로 밀린다
    - condition: rate_on_spoken_region_v5_gate
      usable_of_twelve_candidates: 8
      note: 밴드가 측정된 것과 같은 양이다
    - condition: repeat_render_of_one_cell
      byte_identical: true
      note: 재시도는 무의미하다

superseded_predecessor:
  experiment_id: r01_multi_speaker_candidates_v4
  status: abandoned_before_completion
  bank_manifest_written: false
  rejected_audio_kept: artifacts/reference/r01/multi_speaker_v4/audio/rejected
  defects_measured:
    cells_attempted: 6
    cells_accepted: 3
    cause_ko: >-
      게이트가 파일 전체 길이로 속도를 쟀다. 기각된 3셀 중 일부는 실제 결함(토큰
      상한까지 생성)이고 나머지는 측정 오류였다.
  earlier_predecessors:
    - r01_multi_speaker_candidates_v3
    - r01_cosyvoice_only_candidates_v2

claims_closed_by_this_amendment:
  # Unchanged from v2: no human recording of the R00 sentences exists.
  r04_human_versus_tts_comparison_available: false
  r04_source_kind_blinding_meaningful: false
  human_comparison_available: false
  note_ko: >-
    사람 후보는 여전히 0건이다. R00 20문장은 이 프로젝트가 직접 쓴 CC0 원문이므로
    어떤 코퍼스도 그 문장의 사람 낭독을 갖고 있지 않다. AI Hub 542 화자는 prompt로
    복제되었을 뿐이며, 이들이 R00 문장을 읽은 것이 아니다. 따라서 이 뱅크의
    exemplar는 전부 합성음이고, R04의 "사람 대비" 조건은 D08 실녹음까지 열리지 않는다.

claims_opened_by_this_amendment:
  speaker_axis_tolerance_derivable: true
  note_ko: >-
    prompt 화자 6명(여 3 / 남 3, 연령대 3구간)으로 화자 축 산포가 생긴다.
    다만 "유도 가능"은 "타당"과 다르다. 아래 tolerance_validity를 참조하라.

known_limitations:
  distinct_prompt_voices: 6
  speaker_axis_diversity_available: true
  prompt_voice_source: aihub542_validation_read_speech
  prompt_voice_gender_balance: 2_female_4_male
  prompt_voice_age_bands: 5
  gender_balance_note_ko: >-
    균형이 아니라 **선별의 결과**다. 후보 12명(여 6 / 남 6)을 화자별로 한 문장씩
    렌더해 실측 밴드와 대조한 결과, 사용 가능한 8명은 여 2 / 남 6이었다.
    이 계약은 그중 6명을 뽑되 여성 2명을 모두 포함했다.
  generator_limitation_observed:
    description_ko: >-
      후보 12명 중 4명이 문장을 끝내지 못하고 모델의 토큰 상한까지 생성했다
      (파일 14.40초 고정, 발화 구간 기준 0.90–1.19 음절/초). **그 4명이 전부
      여성이었고, 남성은 6명 중 0명이었다.** prompt 파일 자체는 정상이다
      (선언 길이와 실제 길이 일치, 48 kHz, 전사 일치).
    affected_voices: 4
    affected_voices_female: 4
    affected_voices_male: 0
    interpretation_ko: >-
      CosyVoice2-0.5B가 이 코퍼스의 일부 여성 prompt에서 종료 토큰을 내지 못하는
      것으로 보인다. 원인은 규명하지 않았다. 이 계약은 그 화자들을 **선별로 배제**할
      뿐이며, 배제 사실과 성별 편중을 여기 남긴다.
    consequence_ko: >-
      뱅크의 화자 구성이 남성에 치우친다. f0 축이 절대 음역이 아니라 pitch range를
      비교하도록 바뀌었으므로(F0_MEASUREMENT = voiced_pitch_range_semitones) 여성
      학습자가 음역 때문에 감점되는 공정성 결함은 발생하지 않는다. 남는 비용은
      대표성이며, 학습자 대상 기록에도 이 구성을 드러낸다.
  pitch_axis_available: false
  pitch_axis_note_ko: >-
    v1이 요구한 pitch bucket 3종은 여전히 설계 축으로 존재하지 않는다. 화자 6명이
    pitch 산포를 부수적으로 만들지만, 그것은 화자 축의 결과이지 독립적인 pitch 축이
    아니다. 같은 화자를 pitch shift로 변형하는 것은 새 화자가 아니므로 계상하지 않는다.
  f0_measurement: voiced_pitch_range_semitones
  tolerance_validity_ko: >-
    f0 축은 더 이상 절대 median F0(화자의 음역)를 비교하지 않는다. 음역은 학습자가
    고른 것이 아니므로, 그것을 참조 뱅크와 비교하면 목소리를 이유로 감점하게 된다.
    지금은 **유성 구간의 pitch 이동폭(semitone)** 을 비교하며, 이는 음역과 무관하고
    L2에서 실제로 관찰되는 억양 평탄화를 잡아낸다. 따라서 이 뱅크가 남성에 치우쳐도
    여성 학습자가 음역 때문에 밴드를 벗어나지 않는다.
    다만 **이동폭의 tolerance가 타당한지는 측정으로 확인해야 한다** —
    scripts/report_reference_bank_spread.py로 생성 후 축별 산포를 실측한다.

runtime:
  actual_model_download_allowed: false
  actual_tts_inference_allowed: true
  actual_gpu_access_allowed: false
  gpu_note_ko: >-
    S105 v5가 GPU를 점유 중이며 attestation의 concurrent_training_process_allowed는
    false다. 생성은 CPU에서만 수행한다. 셀당 워커 프로세스가 새로 뜨므로 병렬로
    돌리되, 각 워커의 스레드 수를 제한한다.
  concurrent_workers_allowed: 6
  threads_per_worker: 3
  actual_audio_write_allowed: true
  actual_manifest_write_allowed: true
  actual_human_recording_allowed: false
  environment_files_forbidden: true
  locked_test_access_allowed: false
  expert_holdout_access_allowed: false

