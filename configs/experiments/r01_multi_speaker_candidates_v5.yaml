    sha256: fb4ff89c1268500fede2aa5db2be5ef257fa0c7354b886e94f81813acc412c43
    required_status: approved_for_r01_inference
  read_speech_rate_band:
    # Measured, not chosen. The band decides which renderings may become references,
    # so it comes from a population of real read speech and is pinned like any other
    # source. Produced by scripts/measure_korean_read_speech_rate.py.
    path: artifacts/reference/r01/korean_read_speech_rate_band_v1.json
    sha256: 0d21af5481e9f0a52262ffd7977e47aebdde8c56573d325c505edb58eb364ff4
  prompt_voice_manifest:
    path: data/restricted/prompt_voices/aihub542_screened_v1/prompt_voices.json
    sha256: ff0e968075b0eca6ba3801eff4263d94c12ae0fce18da4b59a485ff4adee6e23
    screened_by:
      script: scripts/screen_r01_prompt_voices.py
      script_sha256: d0ad1783359d0fbb120d7646c1e5ccf276b86fae6b95d219007f243e23023ecf
      selector: scripts/select_screened_prompt_voices.py
      candidates_screened: 12
      candidates_usable: 8
  driver:
    # The gate lives here, so it is pinned like any other source. v4 pinned only
    # the generator and worker, and the gate defect was in the driver.
    path: scripts/generate_r01_candidates.py
    sha256: c50368fffd0a8734a4ee3b1f3c1e0734daccccf6b4a93a00f67205733148b3d5
  generator_module:
    # v2 pinned the path only, so module drift was undetectable. Pinned by digest
    # here because this contract exists because of code that changed.
    path: src/voice_coach/pronunciation_feedback/adapters/reference_generator.py
    sha256: 813ba5a6b3f5abb4f62fbc742313df0c5c9e36c29ebfb43ab37a739f07de3804
  worker:
    path: scripts/cosyvoice_reference_worker.py
    sha256: 80b0a24dba911db9b14007d8cb6fb15187d2ff75c2c73e67c61b9b6af889f6a2
    inference_mode: zero_shot
    inference_mode_reason_ko: >-
      한국어 prompt로 한국어를 합성하므로 cross_lingual이 아니다. 워커는
      prompt_text 없는 요청을 거부한다 — 전사가 없으면 모델에 prompt가 끝난
      지점을 알려줄 것이 없다.
    trimming_removed: true
    trimming_removal_reason_ko: >-
      진폭만으로는 문장 내부 휴지와 문장 종료를 구분할 수 없다. 느린 낭독은 어절
      사이 휴지가 길어 가장 먼저 잘렸다.

candidate_design:
  sentence_ids_from: r00_card
  expected_sentence_count: 20
  source_balance:
    rule: cosyvoice_multi_speaker
    human_candidates_expected: 0
    cosyvoice_candidates_per_sentence: 18
  diversity_preservation:
    dimensions:
      - speed
      - speaker
    required_speed_buckets:
      - slow
      - neutral
      - fast
    required_distinct_speakers: 6
    dimensions_declared_unavailable:
      - pitch
    preserve_all_design_cells_until_r02: true
    posthoc_relabel_or_collapse_allowed: false
  plausibility_gate:
    # A rendering that ran away into babble or stopped mid-sentence sets the
    # tolerance every learner of that sentence is scored against. So it is rejected
    # and re-rendered, never repaired.
    metric: hangul_syllables_per_second
    band_source: canonical_sources.read_speech_rate_band
    band_source_utterances: 1225582
    band_scales_with_speed_bucket: true
    max_attempts: 1
    max_attempts_rationale_ko: >-
      생성이 결정적임을 실측했다(같은 셀 2회 렌더 → 바이트 동일). 재시도는 같은
      결과를 다시 얻을 뿐이므로 1로 둔다. 밴드를 벗어난 셀은 다른 prompt 화자로만
      고칠 수 있다.
    measured_on: spoken_region_not_whole_file
    measured_on_rationale_ko: >-
      밴드는 코퍼스의 SpeechEnd - SpeechStart로 측정했다. 렌더링을 파일 전체 길이로
      재면 앞뒤 무음까지 세어 다른 양을 비교하게 된다. 오디오는 편집하지 않는다 —
      측정만 발화 구간에서 한다.
    rejected_audio_retained: true
    rejected_audio_directory: rejected
    repair_or_trim_allowed: false
  candidate_id:
    scheme: content_addressed_sha256
    inputs:
      - prompt_id
      - normalized_text
      - prompt_voice_id
      - speed_bucket
      - generator_id
      - vendor_revision
      - model_revision
    overwrite_existing_allowed: false

