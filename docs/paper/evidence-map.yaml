# The exact unresolved marker multiset is hashed. Removing/replacing a marker,
# including replacing it with an attractive-looking number, fails validation.
pending_contract:
  marker_regex: '\[PENDING:[^\]]+\]'
  expected_count: 18
  expected_markers_sha256: 1d0cce59025c86879d0a9972f0da31e45e87169b41f5b8fadd427c111e6d7673
  forbidden_numeric_regexes:
    - '수동 정렬 정확도\s*\|\s*(?:NaN|Inf(?:inity)?|[+-]?\d+(?:\.\d+)?)\s*\|'

# B05 remains unresolved. Until a dedicated locked-test artifact exists, the
# development report must say it was unopened, the registry may contain dev only,
# and no manuscript locked-test metric value is permitted.
locked_test_guard:
  access_checks:
    - artifact: explicit_dev_report
      pointer: /leakage_controls/locked_test_accessed
    - artifact: threshold_ablation_report
      pointer: /forbidden_split_access/locked_test
    - artifact: wavlm_base_cache_report
      pointer: /policy/metric_evaluation_performed
    - artifact: wavlm_base_head_report
      pointer: /leakage_controls/stack_accessed
    - artifact: wavlm_base_head_report
      pointer: /leakage_controls/calibration_accessed
    - artifact: wavlm_base_head_report
      pointer: /leakage_controls/locked_test_accessed
    - artifact: wavlm_large_head_report
      pointer: /leakage_controls/stack_accessed
    - artifact: wavlm_large_head_report
      pointer: /leakage_controls/calibration_accessed
    - artifact: wavlm_large_head_report
      pointer: /leakage_controls/locked_test_accessed
    - artifact: wavlm_s103_comparison_report
      pointer: /contract/leakage/stack_accessed
    - artifact: wavlm_s103_comparison_report
      pointer: /contract/leakage/calibration_accessed
    - artifact: wavlm_s103_comparison_report
      pointer: /contract/leakage/locked_test_accessed
    - artifact: wavlm_s103_results_json
      pointer: /scope/stack_accessed
    - artifact: wavlm_s103_results_json
      pointer: /scope/calibration_accessed
    - artifact: wavlm_s103_results_json
      pointer: /scope/locked_test_accessed
    - artifact: wavlm_s103_results_json
      pointer: /scope/promotion_decision_allowed
  registries:
    - artifact: explicit_registry
      array_pointer: /metrics
      split_field: split
      forbidden_splits: [locked_test]
    - artifact: threshold_ablation_registry
      array_pointer: /metrics
      split_field: split
      forbidden_splits: [locked_test]
    - artifact: wavlm_base_head_registry
      array_pointer: /metrics
      split_field: split
      forbidden_splits: [stack, calibration, locked_test]
    - artifact: wavlm_large_head_registry
      array_pointer: /metrics
      split_field: split
      forbidden_splits: [stack, calibration, locked_test]
  forbidden_document_regexes:
    - 'locked[- ]?test[^\n]{0,160}(?:macro F1|AUPRC|QWK|Spearman|MAE|ICC|ECE|Brier)[^\n]{0,40}(?:NaN|Inf(?:inity)?|[+-]?\d+\.\d+)'
