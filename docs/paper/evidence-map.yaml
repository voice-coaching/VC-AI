claims:
  - id: abstract_aihub_records
    source: {artifact: aihub_data_card, kind: json_pointer, pointer: /record_count}
    document: {regex: 'AI Hub 71490 발음 데이터\s*(?P<value>[\d,]+)건'}
    comparison: {type: numeric, decimals: 0}
  - id: abstract_aihub_speakers
    source: {artifact: aihub_data_card, kind: json_pointer, pointer: /speaker_count}
    document: {regex: 'AI Hub 71490 발음 데이터\s*[\d,]+건, (?P<value>[\d,]+)화자'}
    comparison: {type: numeric, decimals: 0}
  - id: abstract_aihub_hours
    source: {artifact: aihub_data_card, kind: json_pointer, pointer: /total_hours}
    document: {regex: 'AI Hub 71490 발음 데이터\s*[\d,]+건, [\d,]+화자, (?P<value>[\d.]+)시간'}
    comparison: {type: numeric, decimals: 3}
  - id: abstract_pairing_percent
    source:
      artifact: aihub_g0_audit
      kind: json_pointer
      pointer: /pairing_rate
      transform: {operation: multiply, value: 100}
    document: {regex: 'pairing (?P<value>[\d.]+)%'}
    comparison: {type: numeric, decimals: 4}
  - id: abstract_decoder_failure_percent
    source:
      artifact: aihub_g0_audit
