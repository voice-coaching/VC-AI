name: Deploy main to RunPod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runpod-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy the committed source and check service readiness
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_SSH_PRIVATE_KEY: ${{ secrets.RUNPOD_SSH_PRIVATE_KEY }}
          RUNPOD_SSH_HOST_KEY: ${{ secrets.RUNPOD_SSH_HOST_KEY }}
          RUNPOD_POD_ID: ${{ vars.RUNPOD_POD_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 deploy/runpod/github_deploy.py
