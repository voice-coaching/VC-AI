name: Base clone CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-links:
    name: All tracked Markdown relative links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate project constraints
        run: python scripts/check_project_constraints.py

      - name: Validate every tracked Markdown link, including research docs
        run: python scripts/check_markdown_links.py

      - name: Validate repository-current source pins
        run: python scripts/check_source_pins.py

  base-install:
    name: Base dependency installation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install base package
        run: python -m pip install -e "."

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Record excluded research-runtime boundary
        if: always()
        run: |
          {
            echo "### CI scope"
            echo
            echo "This job installs the base package and checks dependency consistency."
            echo "It does not claim scorer, visual/GPU, restricted-data, checkpoint, ignored-artifact, or human-gate validation."
            echo "No unit, regression, synthetic-fixture or screen tests run."
          } >> "$GITHUB_STEP_SUMMARY"

  backend-analysis-worker-contract:
    name: Worker dependency installation and image build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install worker transport dependencies
        run: >-
          python -m pip install -e "."
          numpy==2.5.1
          -r requirements/backend-analysis-worker.txt

      - name: Build production worker image without model artifacts
        run: >-
          docker build
          --file deploy/backend-analysis-worker/Dockerfile
          --build-arg VCS_REF="${GITHUB_SHA}"
          --tag intelligentai/backend-analysis-worker:ci
          .

      - name: Verify packaged runtime dependencies
        run: >-
          docker run --rm -e MPLCONFIGDIR=/tmp/matplotlib
          --entrypoint /app/.venv/bin/python
          intelligentai/backend-analysis-worker:ci
          -c "import boto3, mediapipe, redis, soundfile, torch, transformers;
          import korean_phone_ctc"

      - name: Record controlled-runtime boundary
        if: always()
        run: |
          {
            echo "### Worker CI scope"
            echo
            echo "This job installs worker dependencies and builds the worker image."
            echo "It does not load restricted recordings or untracked Seungun model artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
