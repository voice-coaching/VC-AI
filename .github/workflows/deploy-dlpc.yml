name: Deploy main to DLPC

on:
  push:
    branches: [main]
  # Catch-up: a push missed while the DLPC host was down (or its runner offline)
  # is checked every five minutes once it is back. An up-to-date host returns
  # NO_COMPATIBLE_RUNTIME_CHANGES.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_restart:
        description: Restart the exact current main after verifying installed source
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dlpc-production-deployment
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'voice-coaching/intelligentAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Require completed DLPC enrollment
        env:
          DEPLOYMENT_ENABLED: ${{ vars.DLPC_DEPLOYMENT_ENABLED }}
        run: |
          if [ "$DEPLOYMENT_ENABLED" != 'true' ]; then
            echo '::error::DLPC deployment is not enrolled. Install the controller/runner and reconcile the approved runtime before enabling DLPC_DEPLOYMENT_ENABLED.'
            exit 1
          fi
  deploy:
    needs: preflight
    if: github.repository == 'voice-coaching/intelligentAI' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, intelligentai-dlpc-deploy]
    timeout-minutes: 50
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy through the installed controller
        env:
          DEPLOY_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_FORCE_RESTART: ${{ inputs.force_restart || false }}
        run: python3 deploy/dlpc/github_deploy.py

      - name: Record deployment result
        if: always()
        run: |
          if [ -f dlpc-deployment-result.json ]; then
            cat dlpc-deployment-result.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Deployment did not produce a receipt. Inspect the failed step; do not infer success.' >> "$GITHUB_STEP_SUMMARY"
          fi
