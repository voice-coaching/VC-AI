[unix_http_server]
file=/run/intelligentai/dlpc-supervisor.sock
chmod=0600

[supervisord]
nodaemon=false
user=root
pidfile=/run/intelligentai/dlpc-supervisor.pid
logfile=/run/intelligentai/logs/dlpc-supervisor.log
logfile_maxbytes=10MB
logfile_backups=2
childlogdir=/run/intelligentai/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/intelligentai/dlpc-supervisor.sock

[program:analysis]
command=/usr/bin/python3 /opt/intelligentai/app/deploy/dlpc/launch.py analysis
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=45
stopasgroup=true
killasgroup=true
stdout_logfile=/run/intelligentai/logs/analysis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:aws-tunnel]
command=/usr/bin/ssh -NT -o BatchMode=yes -o ConnectTimeout=10 -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/2020067/.ssh/intelligentai_aws_known_hosts -i /home/2020067/.ssh/intelligentai_aws_20261005 -R 127.0.0.1:18080:127.0.0.1:8080 -R 127.0.0.1:18083:127.0.0.1:8083 ec2-user@13.209.184.226
; The numeric login name 2020067 has UID 120067; Supervisor parses digits as UID.
user=120067
autostart=false
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/run/intelligentai/logs/aws-tunnel.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:tts]
command=/usr/bin/python3 /opt/intelligentai/app/deploy/dlpc/launch.py tts
; Start after Native preparation so both cold model loads do not overlap.
autostart=false
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/run/intelligentai/logs/tts.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
