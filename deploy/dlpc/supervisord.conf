[unix_http_server]
file=/run/intelligentai/dlpc-supervisor.sock
chmod=0600

[supervisord]
nodaemon=false
user=root
pidfile=/run/intelligentai/dlpc-supervisor.pid
logfile=/run/intelligentai/logs/dlpc-supervisor.log
logfile_maxbytes=10MB
logfile_backups=2
childlogdir=/run/intelligentai/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/intelligentai/dlpc-supervisor.sock

[program:analysis]
command=/usr/bin/python3 /opt/intelligentai/app/deploy/dlpc/launch.py analysis
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=45
stopasgroup=true
killasgroup=true
stdout_logfile=/run/intelligentai/logs/analysis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; AWS transport is managed separately by start_aws_tunnel.py as UID 120067.
; Its launcher and SSH identity live in persistent home, outside runtime assets.

[program:tts]
command=/usr/bin/python3 /opt/intelligentai/app/deploy/dlpc/launch.py tts
; Start after Native preparation so both cold model loads do not overlap.
autostart=false
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/run/intelligentai/logs/tts.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
