user nobody nogroup;
worker_processes 1;
pid /run/intelligentai-gateway/nginx.pid;
error_log /run/intelligentai-gateway/nginx-error.log crit;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /run/intelligentai-gateway/body;
    proxy_temp_path /run/intelligentai-gateway/proxy;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    add_header Cache-Control "no-store" always;
    server {
        listen 0.0.0.0:8082 default_server;
        location = /gateway/health {
            default_type application/json;
            return 200 '{"status":"alive","service":"api-gateway"}';
        }
        location = /health { proxy_pass http://127.0.0.1:8080; }
        location = /readyz { proxy_pass http://127.0.0.1:8080; }
        location = /health/services { proxy_pass http://127.0.0.1:8080; }
        location = /health/handoff { proxy_pass http://127.0.0.1:8080; }
        location = /health/deployment { proxy_pass http://127.0.0.1:8080; }
        location = /v1/analysis-jobs { proxy_pass http://127.0.0.1:8080; }
        location ~ ^/v1/analysis-jobs/[0-9a-f-]+(/cancel)?$ {
            proxy_pass http://127.0.0.1:8080;
        }
        location = /health/live { proxy_pass http://127.0.0.1:8083; }
        location = /health/ready { proxy_pass http://127.0.0.1:8083; }
        location = /v1/tts/synthesize {
            client_max_body_size 32k;
            proxy_pass http://127.0.0.1:8083;
        }
        location / { return 404; }
    }
}
