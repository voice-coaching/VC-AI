[build-system]
requires = ["setuptools>=78,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-coach"
version = "0.1.0"
description = "Evidence-constrained Korean L2 voice coaching research system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.140.7",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
scorer = [
  "joblib==1.5.3",
  "numpy==2.5.1",
  "psutil==7.2.2",
  "pyarrow==25.0.0",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "safetensors==0.8.0",
  "soundfile==0.14.0",
  "torch==2.12.1",
  "transformers==5.14.1",
]
visual = [
  "mediapipe==1.0.1",
  "numpy==2.5.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voice_coach.evaluation" = [
  "g04_review_frontend/*.html",
  "g04_review_frontend/*.css",
  "g04_review_frontend/*.js",
]
